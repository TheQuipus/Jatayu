version: '3.8'

services:
  # MySQL database container
  db:
    image: mysql:8.0
    container_name: jatayu_mysql_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Jatayu@123
      MYSQL_DATABASE: jatayu_db
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pJatayu@123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Node.js Backend API
  backend:
    build: ./backend
    container_name: jatayu_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: Jatayu@123
      DB_NAME: jatayu_db
      JWT_SECRET: super_secret_jwt_key_change_me_in_production
      GOOGLE_CLIENT_ID: your_google_client_id.apps.googleusercontent.com
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: your_email@gmail.com
      SMTP_PASS: your_email_app_password
      FROM_EMAIL: Jatayu <your_email@gmail.com>
      TWILIO_ACCOUNT_SID: your_twilio_account_sid
      TWILIO_AUTH_TOKEN: your_twilio_auth_token
      TWILIO_PHONE_NUMBER: "+1234567890"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/usr/src/app/uploads

  # Next.js static Frontend
  frontend:
    build:
      context: ./jatayu-frontend-main
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_WS_URL: http://localhost:5000
    container_name: jatayu_frontend_app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
    driver: local
