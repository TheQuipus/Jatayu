# Replica stack: MySQL + backend + frontend.
# Local:
#   1. Copy backend/.env.example → backend/.env
#   2. docker compose up -d --build
# AWS Ubuntu:
#   1. Copy aws.env.example → .env  (next to this file) and set YOUR_EC2_PUBLIC_IP
#   2. Copy backend/.env.example → backend/.env and fill SMTP / Google / admin
#   3. Optional: copy a MySQL dump to docker/mysql/init/01-jatayu_db.sql before the first start
#   4. docker compose --env-file .env up -d --build
# MySQL runs inside Docker (service `db`). Do not apt-install mysql-server on Ubuntu.
# Init SQL runs only on the first empty volume. Later starts reuse db-data.

services:
  db:
    build: ./docker/mysql
    image: jatayu-mysql:replica
    container_name: jatayu_mysql_db
    restart: always
    ports:
      - "${MYSQL_PUBLISH_PORT:-127.0.0.1:3306}:3306"
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Jatayu@123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jatayu_db}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  backend:
    build: ./backend
    image: jatayu-backend:replica
    container_name: jatayu_backend_api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Jatayu@123}
      DB_NAME: ${MYSQL_DATABASE:-jatayu_db}
      DB_SYNC_ALTER: ${DB_SYNC_ALTER:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,http://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3000}
      DIGILOCKER_REDIRECT_URI: ${DIGILOCKER_REDIRECT_URI:-http://localhost:5000/api/expert/kyc/digilocker/callback}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend-uploads:/usr/src/app/uploads

  frontend:
    build:
      context: ./jatayu-frontend-main
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:5000}
    image: jatayu-frontend:replica
    container_name: jatayu_frontend_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
  backend-uploads:
